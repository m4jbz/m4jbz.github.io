## Example Config file
baseURL: "https://example.com"
theme: "terminalcv"
title: "terminalcv"

params:
  version: "2.0.0"
  description: "My terminal cv"
  blog: 
    enabled: true
    lsClassic: true
  prompt:
    core:
      text: "user@t.erminalCV"
      color: "pink"
      before: "["
      beforeColor: "red"
      after: '\]'
      afterColor: "red"
      # separator: '-'
    separator:
      text: "-"
      # color:
    path:
      before: "["
      beforeColor: "red"
      text: "~/terminalcv"
      color: "blue"
      after: '\]'
      afterColor: "red"
    extra:
      text: ": "
      color: "orange"

  # promptColor: grey
  # promptSimbols: ":~$"
  # promptSimbolsColor: grey
  # startxLocation: https://example.com
  # useLess: true
  #customCSS: true
  listLS: true
  #exitLocation: "about:blank"
  exitMessage: "[Session completed, the browserwindow can be safely closed]"
  source: true
  #use a ‎ (blank character) if your first character of the ascii art is a whitespace
  greetingbannercolor: white
  greeting: |
    ‎
     _ __ ___ | || | (_) |__ ____
    | '_ ` _ \| || |_| | '_ \_  /
    | | | | | |__   _| | |_) / / 
    |_| |_| |_|  |_|_/ |_.__/___|
                   |__/
    Type 'help' for a list of available commands

  whois:
    # settings:
    #   useLess: true
    details:
      leftColor: "white"
      rightColor: "white"
      descriptionColor: "white"
      name: "Marco Juarez"
      profession: "Computer Engineer Student"
      location: "Mexico"
      email: "marcoajb05@proton.me"
      homelink: "https://m4jbz.github.io"
      description: |
        I'm Marco, computer engineer at Instituo Tecnológico de Iguala.

  social:
    #settings:
    #  useLess: true
    #  hideName: true
    details:
      - name: "github"
        url: "https://github.com/m4jbz"
      - name: "Discord"
        url: "https://discord.com/users/marco_271828"

  # work:
  #   # settings:
  #   #   useLess: true
  #   details:
  #
  #     - jobTitle: Job with default color title
  #       company: "-"
  #       location: anywhere
  #       date: July 2008 - 2010
  #       description: Description about this default color job

  education:
    details:
      - courseName: Instituto Tecnológico de Iguala
        color: red
        date: August 2023 - December 2027
        description: Computer Engineer degree

  skills:
    settings:
      # useLess: true
    details:
      - name: Linux
        percentage: 90
        description: Using Linux as my daily drive OS since january of 2022.


  # softskills:
  #   # settings:
  #   #   useLess: true
  #   details:
  #     - name: English
  #       color: green
  #       percentage: 67

  languages:
    # settings:
    #   useLess: true
    details:
      - name: English
        color: Blue
        percentage: 67
        description: B1-B2 level

      - name: Spanish
        color: Green
        percentage: 100
        description: Native

  projects:
    # settings:
    #   useLess: true
    details:
      - title: Project Red
        color: red
        date: since 2019
        link: https://example.com
        description: Describing red stuff

      - title: Project Blue
        color: blue
        date: since 2016
        link: https://example.com/blue
        #description: nothing to describe

      - title: Project Default
        date: Since 2017
        link: https://example.com/default
        #description: not there either

  publications:
    # settings:
    #   useLess: true
    details:
      - title: "Machine Learning for Terminal Enthusiasts"
        color: green
        authors: "John Doe, Jane Smith"
        venue: "Journal of Terminal Computing, Vol. 42"
        date: "2025"
        link: "https://example.com/paper1"
        description: "A comprehensive study on ML applications in terminal interfaces"

      - title: "The Art of ASCII: Modern Approaches"
        color: blue
        authors: "John Doe"
        venue: "International Conference on Text-Based Interfaces (ICTBI)"
        date: "2024"
        link: "https://example.com/paper2"
        #description:

      - title: "Understanding Command Line User Experience"
        authors: "John Doe, Bob Wilson, Alice Brown"
        venue: "ACM Transactions on Human-Computer Interaction"
        date: "2023"
        #link:
        description: "Research on improving CLI usability and accessibility"

  certifications:
    # settings:
    #   useLess: true
    details:
      - certName: Example Cert
        #color: "blue"
        company: Example Certifying Company
        date: Date of Completion
        badge: https://www.link.to.badge
        #description: Lorem Ipsum

  misc:
    # settings:
    #   useLess: true
    commandName: newcommand
    title: "This Section can have a different command name"
    titleColor: teal
    content: |
      Here the title and the content can have different colors
      The content can be multi

      line

      And spaces       will be respected as well
      This section will have the default command: misc
      but you can name it something else with the property
      commandName: <String>
      Give it a shot and try and uncomment the line 
      commandName: newcommand
      now instead of misc you can execute the newcommand for this section
      Auto completion will know it too! :D

    contentColor: orange
